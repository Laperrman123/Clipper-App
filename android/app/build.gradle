apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Font ikon (react-native-vector-icons) — mengkopi Ionicons.ttf dll ke assets saat build.
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

/**
 * Konfigurasi React Native Android. Proyek ini memakai RN CLI biasa (tanpa Expo),
 * jadi cukup biarkan seluruh nilai default: entryFile = index.js, reactNativeDir
 * dan codegenDir otomatis dari node_modules.
 */
react {
    if (rnVersion >= versionToNumber(0, 75, 0)) {
        autolinkLibrariesWithApp()
    }
}

/**
 * Set true untuk minify Java bytecode dengan ProGuard di build release.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: 'true').toBoolean()

/**
 * Set true untuk membuang resource yang tidak dipakai di build release.
 */
def enableShrinkResourcesInReleaseBuilds = (findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'true').toBoolean()

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.yourcompany.clipperapp'
    defaultConfig {
        applicationId 'com.potongin.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // Batasi native library ke arsitektur HP sungguhan. Tanpa ini, APK
        // universal ikut membawa lib x86/x86_64 (~37 MB) yang tidak terpakai.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Kredensial disimpan di android/keystore.properties yang TIDAK
            // di-push ke GitHub (lihat .gitignore). Kalau file itu tidak ada,
            // build release jatuh ke debug keystore supaya tetap bisa dites.
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            shrinkResources enableShrinkResourcesInReleaseBuilds
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    /**
     * Pisahkan APK per-ABI supaya satu file APK tidak membawa native lib semua
     * arsitektur. Hanya arm64-v8a dan armeabi-v7a (perangkat nyata); x86/x86_64
     * (emulator) dibuang karena menambah puluhan MB, terutama dari FFmpeg.
     * universalApk true menghasilkan SATU APK berisi keduanya — file inilah
     * yang dibagikan ke orang lain.
     */
    splits {
        abi {
            reset()
            enable true
            universalApk true
            include 'arm64-v8a', 'armeabi-v7a'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: true)
        }
        // libc++_shared.so dibundel oleh beberapa library; ambil satu saja.
        pickFirsts += ['lib/**/libc++_shared.so']
    }
}

// Apply static values from `gradle.properties` to `android.packagingOptions`
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    for (i in 0..<options.size()) options[i] = options[i].trim();
    options -= ""

    if (options.length > 0) {
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}
